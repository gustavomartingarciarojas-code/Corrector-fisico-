name: Compilar APK Todo a Imagenes

on:
  push:
    paths:
      - "imagenes/**"
      - ".github/workflows/imagenes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imagenes
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk todo-a-imagenes.apk

      - name: Publicar APK en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imagenes
          name: "Todo a Imagenes - última versión"
          body: "APK compilado automáticamente. Descargá todo-a-imagenes.apk e instalalo en la tablet."
          files: imagenes/todo-a-imagenes.apk

      - name: Publicar log si falla
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: imagenes-log
          name: "Log de compilación (Todo a Imagenes)"
          body: "Log de la última compilación fallida."
          files: imagenes/build.log
